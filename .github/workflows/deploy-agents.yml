name: Deploy Agents to ECR

on:
  push:
    branches: [ main ]
    paths:
      - 'agents/**'
      - '.github/workflows/deploy-agents.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'agents/**'
  workflow_dispatch:  # Allow manual trigger

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: locusgen-dev-agents

jobs:
  deploy:
    name: Build and Deploy Agents
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Clean up old images (keep last 5)
      run: |
        # Get list of images sorted by push date (oldest first)
        OLD_IMAGES=$(aws ecr list-images \
          --repository-name $ECR_REPOSITORY \
          --filter tagStatus=TAGGED \
          --query 'imageIds[?imageTag!=`latest`]' \
          --output json | \
          jq -r '.[:-5] | .[] | .imageDigest' 2>/dev/null || echo "")
        
        # Delete old images if any exist
        if [ ! -z "$OLD_IMAGES" ]; then
          echo "🧹 Cleaning up old images..."
          echo "$OLD_IMAGES" | while read digest; do
            if [ ! -z "$digest" ]; then
              aws ecr batch-delete-image \
                --repository-name $ECR_REPOSITORY \
                --image-ids imageDigest=$digest || true
            fi
          done
        else
          echo "✅ No old images to clean up"
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd agents
        
        # Clean up any existing builders
        docker buildx rm locusgen-builder || true
        
        # Create new builder for ARM64
        docker buildx create --name locusgen-builder --use
        
        # Build and push single image for ARM64
        docker buildx build \
          --platform linux/arm64 \
          --push \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          --file Dockerfile \
          .
        
        # Clean up builder
        docker buildx rm locusgen-builder
        
        echo "✅ Single image built and pushed successfully"
        echo "📦 Image URI: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        echo "🏷️  Latest URI: $ECR_REGISTRY/$ECR_REPOSITORY:latest"

    - name: Verify image and update deployment info
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Verify the image exists and get its details
        aws ecr describe-images \
          --repository-name $ECR_REPOSITORY \
          --image-ids imageTag=$IMAGE_TAG \
          --query 'imageDetails[0].[imageSizeInBytes,imagePushedAt]' \
          --output table
        
        # Get image size in MB
        IMAGE_SIZE=$(aws ecr describe-images \
          --repository-name $ECR_REPOSITORY \
          --image-ids imageTag=$IMAGE_TAG \
          --query 'imageDetails[0].imageSizeInBytes' \
          --output text)
        
        IMAGE_SIZE_MB=$((IMAGE_SIZE / 1024 / 1024))
        
        echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image URI:** \`$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Latest URI:** \`$ECR_REGISTRY/$ECR_REPOSITORY:latest\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image Size:** ${IMAGE_SIZE_MB} MB" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
        echo "1. Update your AgentCore Runtime to use the new image" >> $GITHUB_STEP_SUMMARY
        echo "2. The \`latest\` tag will be used automatically if configured" >> $GITHUB_STEP_SUMMARY
        
        # Fail if image is suspiciously small (less than 100MB)
        if [ $IMAGE_SIZE_MB -lt 100 ]; then
          echo "❌ ERROR: Image size is too small ($IMAGE_SIZE_MB MB). Something went wrong with the build."
          exit 1
        fi
        
        echo "✅ Image verification passed: $IMAGE_SIZE_MB MB"